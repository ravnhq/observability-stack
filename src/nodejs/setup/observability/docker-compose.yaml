services:
  mimir:
    image: grafana/mimir:latest
    container_name: grafana-mimir
    command: ["-config.expand-env=true", "-config.file=/etc/mimir/mimir.yaml"]
    ports:
      - "${MIMIR_PORT:-9009}:${MIMIR_INTERNAL_PORT:-9009}"
    volumes:
      - ./observability/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - ./observability/mimir-runtime.yaml:/etc/mimir/runtime.yaml:ro
      - ./observability/data/mimir:/data
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MULTITENANCY_ENABLED=${MULTITENANCY_ENABLED:-false}
      - STORAGE_TYPE=${STORAGE_TYPE:-filesystem}
      - MIMIR_DATA_PATH=${MIMIR_DATA_PATH:-/data}
      - MIMIR_REPLICATION_FACTOR=${MIMIR_REPLICATION_FACTOR:-1}
      - MIMIR_INGESTION_RATE=${MIMIR_INGESTION_RATE:-50000}
      - MIMIR_INGESTION_BURST=${MIMIR_INGESTION_BURST:-100000}
    networks:
      - observability
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: grafana-loki
    command: ["-config.expand-env=true","-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${LOKI_PORT:-3100}:${LOKI_INTERNAL_PORT:-3100}"
    volumes:
      - ./observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - ./observability/data/loki:/loki
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOKI_REPLICATION_FACTOR=${LOKI_REPLICATION_FACTOR:-1}
      - STORAGE_TYPE=${STORAGE_TYPE:-filesystem}
      - LOKI_DATA_PATH=${LOKI_DATA_PATH:-/loki/chunks}
      - LOKI_WAL_ENABLED=${LOKI_WAL_ENABLED:-true}
      - LOKI_COMPACTION_ENABLED=${LOKI_COMPACTION_ENABLED:-true}
    networks:
      - observability
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: grafana-tempo
    command: ["-config.expand-env=true", "-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "${TEMPO_PORT:-3200}:${TEMPO_INTERNAL_PORT:-4317}"
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - ./observability/data/tempo:/var/tempo
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MULTITENANCY_ENABLED=${MULTITENANCY_ENABLED:-false}
      - ALLOY_OTLP_GRPC_PORT=${ALLOY_OTLP_GRPC_PORT:-4317}
      - ALLOY_OTLP_HTTP_PORT=${ALLOY_OTLP_HTTP_PORT:-4318}
      - TEMPO_REPLICATION_FACTOR=${TEMPO_REPLICATION_FACTOR:-1}
      - STORAGE_MODE=${STORAGE_MODE:-local}
      - TEMPO_DATA_PATH=${TEMPO_DATA_PATH:-/var/tempo}
    networks:
      - observability
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: grafana-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "${ALLOY_UI_PORT:-12345}:12345"
      - "${ALLOY_OTLP_GRPC_PORT:-4317}:${ALLOY_OTLP_GRPC_PORT:-4317}"
      - "${ALLOY_OTLP_HTTP_PORT:-4318}:${ALLOY_OTLP_HTTP_PORT:-4318}"
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
    environment:
      - MIMIR_HOST=${MIMIR_HOST:-mimir}
      - LOKI_HOST=${LOKI_HOST:-loki}
      - TEMPO_HOST=${TEMPO_HOST:-tempo}
      - MIMIR_INTERNAL_PORT=${MIMIR_INTERNAL_PORT:-9009}
      - LOKI_INTERNAL_PORT=${LOKI_INTERNAL_PORT:-3100}
      - TEMPO_INTERNAL_PORT=${TEMPO_INTERNAL_PORT:-4317}
      - ALLOY_OTLP_GRPC_PORT=${ALLOY_OTLP_GRPC_PORT:-4317}
    depends_on:
      - mimir
      - loki
      - tempo
    networks:
      - observability
    restart: unless-stopped

  pyroscope:
    image: grafana/pyroscope:latest
    container_name: grafana-pyroscope
    ports:
      - "${PYROSCOPE_PORT:-4040}:4040"
    networks:
      - observability
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3030}:${GRAFANA_INTERNAL_PORT:-3000}"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GF_AUTH_ANONYMOUS_ORG_ROLE:-Admin}
      - GF_USERS_DEFAULT_THEME=dark
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/data/grafana:/var/lib/grafana
    networks:
      - observability
    depends_on:
      - mimir
      - loki
      - tempo
      - pyroscope
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: nextjs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-example}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-app
    environment:
      # Core app settings
      - NODE_ENV=production
      - PORT=3000
      
      # Database connection
      - DATABASE_URL=postgresql://postgres:admin123@postgres:5432/example?schema=public
      
      # Service Configuration
      - SERVICE_NAME=nextjs-app
      - SERVICE_VERSION=1.0.0
      
      # OpenTelemetry settings
      - OTEL_COLLECTOR_URL=http://alloy:4318
      
      # Pyroscope profiling
      - PYROSCOPE_ENABLED=true
      - PYROSCOPE_ENDPOINT=http://pyroscope:4040
      
      # Logging
      - LOG_LEVEL=info
      
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      alloy:
        condition: service_started
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local

networks:
  observability:
    driver: bridge
