# ===================================================
# Spring Boot Application Configuration (Generic Template)
# ===================================================

# Application Name
spring.application.name=${SPRING_APPLICATION_NAME:myapp}

# Server Configuration
server.port=${SERVER_PORT:8080}

# ===================================================
# Actuator/Management Endpoints Configuration
# ===================================================

# Expose health, info, prometheus, and metrics endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics

# Show detailed health information
management.endpoint.health.show-details=always

# Enable Prometheus metrics export
management.metrics.export.prometheus.enabled=true

management.metrics.distribution.percentiles-histogram.http.server.requests=true
