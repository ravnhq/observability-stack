# ===================================================
# Spring Boot Application Configuration (Generic Template with PostgreSQL)
# ===================================================

# Application Name
spring.application.name=${SPRING_APPLICATION_NAME:myapp}

# Server Configuration
server.port=${SERVER_PORT:8080}

# ===================================================
# PostgreSQL Database Configuration
# ===================================================

# Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mydb}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:mypassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ===================================================
# Actuator/Management Endpoints Configuration
# ===================================================

# Expose health, info, prometheus, and metrics endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics

# Show detailed health information
management.endpoint.health.show-details=always

# Enable Prometheus metrics export
management.metrics.export.prometheus.enabled=true

management.metrics.distribution.percentiles-histogram.http.server.requests=true
