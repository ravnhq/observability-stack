# ===================================================
# Spring Boot Application Configuration (Generic Template with PostgreSQL)
# ===================================================

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:myapp}

  # ===================================================
  # PostgreSQL Database Configuration
  # ===================================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mydb}
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:mypassword}
    driver-class-name: org.postgresql.Driver

    # HikariCP Connection Pool Configuration
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: 20000
      idle-timeout: 300000

server:
  port: ${SERVER_PORT:8080}

# ===================================================
# Actuator/Management Endpoints Configuration
# ===================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
