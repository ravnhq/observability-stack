services:
  postgres:
    image: postgres:16-alpine
    container_name: nextjs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-userdemo}
      POSTGRES_USER: ${POSTGRES_USER:-userdemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-userdemo}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-userdemo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: nextjs-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-userdemo}:${POSTGRES_PASSWORD:-userdemo}@postgres:5432/${POSTGRES_DB:-userdemo}?sslmode=disable"
    ports:
      - "9188:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - observability
    restart: unless-stopped

  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-userdemo}:${POSTGRES_PASSWORD:-userdemo}@postgres:5432/${POSTGRES_DB:-userdemo}?schema=public
      - SERVICE_NAME=nextjs-app
      - SERVICE_VERSION=1.0.0
      - OTEL_COLLECTOR_URL=http://alloy:4318
      - PYROSCOPE_ENABLED=true
      - PYROSCOPE_ENDPOINT=http://pyroscope:4040
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - observability
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/tasks').then(()=>process.exit(0)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["npm", "run", "start"]
    restart: unless-stopped

  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: nextjs-node-exporter
    command:
      - '--path.rootfs=/host'
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro'
    networks:
      - observability

volumes:
  postgres-data:
    driver: local

networks:
  observability:
    driver: bridge
