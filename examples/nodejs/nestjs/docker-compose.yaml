services:

  # ===========================================
  # PostgreSQL - Application Database
  # ===========================================
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-mydb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # PostgreSQL Exporter for Prometheus metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    command: ['--collector.stat_statements', '--collector.stat_statements.include_query']
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mypassword}@postgres:5432/${POSTGRES_DB:-mydb}?sslmode=disable"
    ports:
      - "9187:9187"  # Exposed for external scraping by LGTM stack
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # ===========================================
  # NestJS Application
  # ===========================================
  nestjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs-app
    environment:
      - NODE_ENV=production
      - PORT=${SERVER_PORT:-3000}
      - DB_URL=${DB_URL:-postgres://myuser:mypassword@postgres:5432/mydb}
      - OTEL_COLLECTOR_URL=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      - OTEL_SERVICE_NAME=nestjs-app
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - '${SERVER_PORT:-3000}:${SERVER_PORT:-3000}'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro'
    networks:
      - app-network

volumes:
  postgres-data:
    driver: local

networks:
  app-network:
    driver: bridge
