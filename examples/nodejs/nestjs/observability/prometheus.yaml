global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'nestjs-observability'

# Enable remote write receiver to accept metrics from OTEL collector
remote_write: []

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape OpenTelemetry Collector internal metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  # Scrape OpenTelemetry Collector's prometheus exporter (app metrics)
  - job_name: 'otel-collector-metrics'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 10s

  # Scrape NestJS application metrics (if exposed)
  - job_name: 'nestjs-app'
    static_configs:
      - targets: ['nestjs-app:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    # Don't fail if metrics endpoint doesn't exist
    honor_labels: true

  # Scrape Tempo metrics
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  # Scrape Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']