services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: userdemo-agent-micrometer-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-userdemo}
      POSTGRES_USER: ${POSTGRES_USER:-userdemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-userdemo}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-userdemo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # PostgreSQL Exporter for Prometheus metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: userdemo-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-userdemo}:${POSTGRES_PASSWORD:-userdemo}@postgres:5432/${POSTGRES_DB:-userdemo}?sslmode=disable"
    ports:
      - "9187:9187"  # Postgres exporter metrics endpoint
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - observability
    restart: unless-stopped

  # ===========================================
  # 🆕 Express.js Application (Updated for Express)
  # ===========================================
  express-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express-app
    environment:
      # Core app settings
      - NODE_ENV=production
      - PORT=3000
      
      # Database connection
      - DATABASE_URL=postgresql://${POSTGRES_USER:-userdemo}:${POSTGRES_PASSWORD:-userdemo}@postgres:5432/${POSTGRES_DB:-userdemo}?schema=public
      
      # OpenTelemetry settings (matching your telemetry.ts)
      - TELEMETRY_ENABLED=true
      - SERVICE_NAME=express-app
      - SERVICE_VERSION=1.0.0
      - OTEL_COLLECTOR_URL=http://alloy:4318
      - METRIC_EXPORT_INTERVAL=5000
      
      # Pyroscope profiling
      - PYROSCOPE_ENABLED=true
      - PYROSCOPE_ENDPOINT=http://pyroscope:4040
      
      # Logging
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      
      # Application-specific
      - API_PREFIX=/api/v1
      - CORS_ORIGIN=*
      - REQUEST_TIMEOUT=30000
      
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - observability
    # 🔧 Updated health check to match your app structure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["npm", "run", "start:prod"]
    restart: unless-stopped

  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro'
    networks:
      - observability

volumes:
  postgres-data:
    driver: local

networks:
  observability:
    driver: bridge

